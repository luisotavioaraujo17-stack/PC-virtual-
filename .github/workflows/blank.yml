#!/bin/bash
VM="PC-Virtual"
DISK="pcvirtual.qcow2"
ISO="Windows.iso"
RAM="16G"
CPU="8"
DISK_SIZE="120G"
UEFI="/usr/share/OVMF/OVMF_CODE.fd"
qemu-img create -f qcow2 "$DISK" "$DISK_SIZE"
qemu-system-x86_64 \
-enable-kvm \
-machine q35,accel=kvm \
-name "$VM" \
-cpu host \
-smp "$CPU" \
-m "$RAM" \
-drive if=pflash,format=raw,readonly=on,file="$UEFI" \
-drive file="$DISK",if=none,id=disk0,format=qcow2 \
-device virtio-blk-pci,drive=disk0 \
-cdrom "$ISO" \
-device virtio-net-pci,netdev=net0 \
-netdev user,id=net0 \
-device virtio-balloon-pci \
-device virtio-rng-pci \
-usb \
-device usb-tablet \
-vga virtio \
-display gtk \
-boot order=d \
-monitor stdio \
-no-reboot \
-nodefaults \
-device ich9-ahci,id=sata \
-device virtio-scsi-pci,id=scsi0 \
-drive if=none,id=extra,format=qcow2,file=extra.qcow2 \
-device scsi-hd,drive=extra \
-device virtio-serial-pci \
-chardev spicevmc,id=vdagent,name=vdagent \
-device virtserialport,chardev=vdagent,name=com.redhat.spice.0 \
-spice port=5930,disable-ticketing=on \
-device virtio-vga \
