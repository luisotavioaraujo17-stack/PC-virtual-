```yaml
name: PC Virtual V5 BR - A10 RDP Tailscale
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  criar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Login Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Criar rede e VM
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          RG="rg-v5-br"; LOC="brazilsouth"; VM="vm-v5-a10"; USER="rdpadmin"
          az group create -n "$RG" -l "$LOC"
          az network vnet create -g "$RG" -n vnet-v5-br \
            --address-prefix 10.50.0.0/16 \
            --subnet-name default --subnet-prefix 10.50.0.0/24
          az vm create -g "$RG" -n "$VM" -l "$LOC" \
            --image Win2022Datacenter \
            --size Standard_NV36ads_A10_v5 \
            --admin-username "$USER" --vnet-name vnet-v5-br \
            --subnet default --storage-sku Premium_LRS \
            --public-ip-sku Standard --accelerated-networking true
          az vm extension set -g "$RG" --vm-name "$VM" \
            --name NvidiaGpuDriverWindows \
            --publisher Microsoft.HpcCompute --version 1.10
          az vm run-command invoke -g "$RG" -n "$VM" \
            --command-id RunPowerShellScript \
            --scripts '
              param([string]$TS_KEY)
              $u="https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
              $m="$env:TEMP\tailscale.msi"
              Invoke-WebRequest $u -OutFile $m
              Start-Process msiexec.exe -ArgumentList "/i",$m,"/qn" -Wait
              $t="C:\Program Files\Tailscale\tailscale.exe"
              & $t up --accept-dns=false --auth-key=$TS_KEY --unattended=true
              Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
              & $t ip -4
            ' --parameters "TS_KEY=$TS_KEY"
          az vm list-ip-addresses -g "$RG" -n "$VM" -o table
```
