name: VM Gamer RDP BR
on:
  workflow_dispatch:
jobs:
  windows-gamer:
    runs-on: windows-latest
    steps:
      - name: Sistema
        shell: powershell
        run: |
          Write-Host "Preparando VM Gamer..."
          Get-ComputerInfo | Select-Object WindowsProductName
      - name: Região Brasil
        shell: powershell
        run: |
          Set-Culture pt-BR
          Set-WinSystemLocale pt-BR
          Set-WinHomeLocation -GeoId 32
      - name: RDP
        shell: powershell
        run: |
          Get-Service TermService
          Get-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: GPU
        shell: powershell
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name,DriverVersion
      - name: CPU
        shell: powershell
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name,NumberOfCores
      - name: RAM
        shell: powershell
        run: |
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          Write-Host "RAM: $([math]::Round($ram/1GB,2)) GB"
      - name: DirectX
        shell: powershell
        run: |
          dxdiag /t C:\dxdiag.txt
          Write-Host "DirectX verificado"
      - name: Pasta Gamer
        shell: powershell
        run: |
          New-Item C:\GamerVM -ItemType Directory -Force
          Write-Host "Ambiente criado"
      - name: Final
        run: |
          echo "VM Gamer PT-BR preparada"
          echo "RDP verificado"
