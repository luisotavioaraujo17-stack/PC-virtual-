name: PC Virtual
on:
  workflow_dispatch:
jobs:
  virtual-pc:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar sistema
        run: sudo apt update
      - name: Instalar QEMU
        run: sudo apt install -y qemu-system-x86
      - name: Instalar ferramentas
        run: sudo apt install -y qemu-utils
      - name: Criar diretório
        run: mkdir -p vm
      - name: Criar disco virtual
        run: qemu-img create -f qcow2 vm/disk.qcow2 120G
      - name: Baixar configuração
        run: echo "Configurando VM"
      - name: Definir memória
        run: echo "RAM=16G" >> vm/config
      - name: Definir CPU
        run: echo "CPU=8" >> vm/config
      - name: Definir armazenamento
        run: echo "DISK=120G" >> vm/config
      - name: Configurar rede
        run: echo "NETWORK=virtio" >> vm/config
      - name: Configurar vídeo
        run: echo "GPU=virtio" >> vm/config
      - name: Configurar áudio
        run: echo "AUDIO=default" >> vm/config
      - name: Verificar disco
        run: qemu-img info vm/disk.qcow2
      - name: Validar configuração
        run: cat vm/config
      - name: Preparar VM
        run: echo "VM preparada"
      - name: Iniciar VM
        run: |
          qemu-system-x86_64 \
            -m 16G \
            -smp 8 \
            -drive file=vm/disk.qcow2,format=qcow2 \
            -device virtio-net-pci,netdev=n0 \
            -netdev user,id=n0 \
            -vga virtio \
            -nographic
