```yaml
name: VM RDP Tailscale Brasil

on:
  workflow_dispatch:

jobs:
  criar-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Criar VM
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          RG="rg-rdp-br"
          LOCATION="brazilsouth"
          VM="vm-rdp-br"
          USER="rdpadmin"

          az group create \
            --name "$RG" \
            --location "$LOCATION"

          az vm create \
            --resource-group "$RG" \
            --name "$VM" \
            --location "$LOCATION" \
            --image Win2022Datacenter \
            --size Standard_D4s_v5 \
            --admin-username "$USER" \
            --public-ip-sku Standard

          az vm run-command invoke \
            --resource-group "$RG" \
            --name "$VM" \
            --command-id RunPowerShellScript \
            --scripts "
              \$url='https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
              \$msi='\$env:TEMP\tailscale.msi'
              Invoke-WebRequest \$url -OutFile \$msi
              Start-Process msiexec.exe -ArgumentList '/i',\$msi,'/qn' -Wait
              & 'C:\Program Files\Tailscale\tailscale.exe' up --accept-dns=false --auth-key='$TS_KEY'
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
              Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
              & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
            "

      - name: Mostrar IP da VM
        run: |
          az vm list-ip-addresses \
            --resource-group rg-rdp-br \
            --name vm-rdp-br \
            --output table
```
